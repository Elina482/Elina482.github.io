<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase GitHub Auth</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f6f8fa;
        }
        #github-login-btn {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #24292e;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #github-login-btn:hover {
            background-color: #555;
        }
        #user-info {
            margin-top: 20px;
            text-align: center;
        }
        #user-info img {
            border-radius: 50%;
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Кнопка для входа -->
    <button id="github-login-btn">Войти через GitHub</button>

    <!-- Сюда мы выведем профиль пользователя после успешного входа -->
    <div id="user-info"></div>

    <script type="module">
        // 1. Импортируем SDK Firebase напрямую
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GithubAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 2. Настройки вашего проекта
        const firebaseConfig = {
          apiKey: "AIzaSyAFDCNh4ElS5r-vOptXacCHbaJFn4J-KSk",
          authDomain: "project456-a78d8.firebaseapp.com",
          projectId: "project456-a78d8",
          storageBucket: "project456-a78d8.firebasestorage.app",
          messagingSenderId: "813964467113",
          appId: "1:813964467113:web:615997834cef9da21d82b8"
        };

        // 3. Инициализируем приложение
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GithubAuthProvider();

        const loginButton = document.getElementById("github-login-btn");
        const userInfoDiv = document.getElementById("user-info");

        // 4. Вешаем событие клика на кнопку
        loginButton.addEventListener("click", async () => {
            try {
                // Открываем окно входа GitHub
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Отображаем аватар и имя пользователя на странице
                userInfoDiv.innerHTML = `
                    <img src="${user.photoURL}" alt="Аватар">
                    <h2>Привет, ${user.displayName || 'пользователь'}!</h2>
                    <p>Никнейм в GitHub: @${user.reloadUserInfo.screenName || 'не указан'}</p>
                `;
            } catch (error) {
                console.error("Ошибка:", error);
                alert("Не удалось войти: " + error.message);
            }
        });
    </script>
</body>
</html>
